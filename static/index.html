<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Rock Hall Inductees Explorer</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Franklin:wght@400;600;700&display=swap"
		rel="stylesheet"
	/>
	<link rel="stylesheet" href="style.css" />
</head>
<body>
	<div class="bg-grid" aria-hidden="true"></div>
	<main class="shell">
		<section class="hero">
			<p class="kicker">Hall Of Fame</p>
			<h1>Inductee Year Browser</h1>
			<p class="subtitle">Choose a year to explore who was inducted.</p>
		</section>

		<section class="panel" aria-label="Year selection">
			<label for="year-select" class="label">Induction Year</label>
			<div class="select-wrap">
				<select id="year-select" name="year-select" disabled>
					<option value="">Loading years...</option>
				</select>
			</div>
			<p id="status" role="status" aria-live="polite">Requesting available years...</p>
			<div class="categories-wrap" aria-live="polite">
				<h2>Categories With New Inductees</h2>
				<ul id="categories-list" class="categories-list"></ul>
			</div>
			<div class="inductees-wrap" aria-live="polite">
				<h2>Inductees</h2>
				<ul id="inductees-list" class="inductees-list"></ul>
			</div>
		</section>
	</main>

	<script src="script.js" defer></script>
</body>
</html>
